services:
  bookmarks:
    build: .
    image: smart-bookmarks:latest
    container_name: smart-bookmarks
    restart: unless-stopped
    ports:
      - "${PORT:-5656}:5656"
    environment:
      TZ: ${TZ:-Europe/Madrid}
      # Si AUTH_PASSWORD tiene valor, el navegador pedirá usuario y contraseña.
      # Se configuran en el archivo .env (copia .env.example).
      AUTH_USER: ${AUTH_USER:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
    volumes:
      - bookmarks-data:/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5656/api/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bookmarks-data:
